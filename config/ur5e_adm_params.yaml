# Parameters for the admittance control
admittance_control_node:
  ros__parameters:

    manipulator_name:   "manipulator"                         # Name of the manipulator, default "manipulator" (to match the planner topic names)

    n_joints:           6                                     # Number of joints of the manipulator, default 6

    m_d:                [15.0, 15.0, 15.0,  0.1,  0.1,  0.1]  # Diagonal mass    coefficients (kg)

    k_d:                [30.0, 30.0, 30.0,  1.0,  1.0,  1.0]  # Diagonal spring  coefficients (N/m)

    b_d:                [30.0, 30.0, 30.0,  0.5,  0.5,  0.5]  # Diagonal damping coefficients (Ns/m)

    loop_rate:          500.0                                 # Hz

    dz_force:           5.0                                   # force  dead zone
    dz_torque:          1.0                                   # torque dead zone

    force_cut_freq:     100.0                                 # cut out frequence for wrench RC filter

    kp_pos:             0.0                                   # kp for position compensation
    kp_rot:             0.0                                   # kp for rotation compensation

    force_feed_topic:   "/ur_rtde/ft_sensor"                  # force sensor reading topic, default "/ur_rtde/ft_sensor", or "/wrench_ati"

    command_topic:      "manipulator/cmd_vel"                 # vel command to the manipulator's joints, default "manipulator/cmd_vel"
                                                              #   or "/ur_rtde/controllers/cartesian_velocity_controller/command"

    tcp_pose_topic:     "manipulator/tcp_pose"                # topic to publish the TCP pose, default "manipulator/tcp_pose"
    
    tcp_vel_topic:      "manipulator/tcp_vel"                 # topic to publish the TCP velocity, default "manipulator/tcp_vel"

    zero_ft_topic:      "/ur_rtde/zeroFTSensor"               # server to reset the force/torque sensor, default
                                                              #   "/ur_rtde/zeroFTSensor"
   
    kp_push:            0.001                                 # Proportional gain for goal force regulation in the pushing task

    push_force_goal:    8.0                                   # Force goal to be regulated in the pushing task

    safe_push_dist:     0.20                                  # Safety distance for the force regulation in the pushing task